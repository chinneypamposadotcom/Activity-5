<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Clothify streetwear — built different.">
  <title>Clothify | Street Made</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Pirata+One&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero" id="home">
    <header class="header">
      <a class="logo" href="#home" aria-label="Clothify home">
        <span class="logo-symbol">C<span>F</span></span>
        <span class="logo-name">CLOTHIFY</span>
        <small>WEAR YOUR IDENTITY</small>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <ul>
          <li><a href="#shop">SHOP</a></li>
          <li><a href="#new">NEW IN</a></li>
          <li><a href="#best">BEST SELLERS</a></li>
          <li><a href="#collections">COLLECTIONS</a></li>
          <li><a href="#about">ABOUT</a></li>
        </ul>
      </nav>

      <div class="header-tools" aria-label="Shop tools">
        <a href="#search" aria-label="Search" class="search-icon"></a>
        <a href="#account" aria-label="Account" class="user-icon"><span></span></a>
        <a href="#notifications" aria-label="Notifications" class="bell-icon">♧</a>
      </div>
    </header>

    <section class="hero-content" aria-labelledby="hero-title">
      <div class="copy">
        <p class="eyebrow">– &nbsp;BUILT DIFFERENT.</p>
        <h1 id="hero-title">STREET<br>MADE</h1>
        <p class="description">High quality street wear crafted for<br class="desktop-break"> those who stand out, not fit in.</p>
        <div class="actions">
          <a class="button button-green" href="#shop">SHOP NOW <span>⟶</span></a>
          <a class="button button-outline" href="#collections">EXPLORE NOW</a>
        </div>
      </div>
      <span class="scribble" aria-hidden="true">⌁</span>
    </section>

    <aside class="side-values" aria-label="Our values">
      <span>QUALITY</span><i></i>
      <span>COMFORT</span><i></i>
      <span>UNIQUENESS</span>
    </aside>
    <div class="bottom-shade"></div>
  </main>
</body>
</html>
